[env:m5stack-stamps3]
platform = espressif32@6.7.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCARDPUTER_BACKEND=1
  ; Cardputer ADV StampS3 has no PSRAM — full 63KB sprite disabled, dirty-region + clip used instead
  ; Uncomment to build with native USB-HID host for external keyboard (requires ARDUINO_USB_MODE=0)
  ; Custom build for host: pio run -e m5stack-stamps3-usbhost
lib_deps =
  m5stack/M5Cardputer @ ^1.0.3
  m5stack/M5Unified @ ^0.2.5

[env:m5stack-stamps3-usbhost]
platform = espressif32@6.7.0
board = m5stack-stamps3
framework = arduino
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=0
  -DCARDPUTER_BACKEND=1
  -DHAS_USB_HOST=1
lib_deps =
  m5stack/M5Cardputer @ ^1.0.3
  m5stack/M5Unified @ ^0.2.5
