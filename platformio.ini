[env:m5stack-cardputer]
platform = espressif32
board = m5stack-cardputer
framework = arduino
monitor_speed = 115200

; 🧼 NO "-w" AND CLEAN MULTI-CORE VERIFICATION LOGS:
build_flags = 
    -D CORE_DEBUG_LEVEL=3

; 📦 STRICTLY ALIGNED DATA IDENTIFIERS FOR DEPENDENCIES:
lib_deps =
    m5stack/M5Cardputer
    m5stack/M5GFX
    m5stack/M5Unified
    adafruit/Adafruit_NeoPixel